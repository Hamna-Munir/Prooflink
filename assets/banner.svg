<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ProofLink - Check before you trust" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0e1b4d"/>
      <stop offset="0.6" stop-color="#143554"/>
      <stop offset="1" stop-color="#1b5668"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="1130" cy="40" r="220" fill="#ffffff" fill-opacity="0.04"/>

    <!-- investigation graph (behind the card) -->
    <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.6" fill="none">
      <line x1="925" y1="165" x2="700" y2="70"/>
      <line x1="925" y1="165" x2="680" y2="200" stroke-dasharray="5 5"/>
      <line x1="925" y1="165" x2="760" y2="282"/>
      <line x1="925" y1="165" x2="1135" y2="75"/>
      <line x1="925" y1="165" x2="1150" y2="215" stroke-dasharray="5 5"/>
      <line x1="925" y1="165" x2="1060" y2="292"/>
      <line x1="925" y1="165" x2="900" y2="34"/>
      <line x1="700" y1="70" x2="680" y2="200" stroke-opacity="0.15"/>
      <line x1="1135" y1="75" x2="1150" y2="215" stroke-opacity="0.15"/>
    </g>
    <g>
      <circle cx="700" cy="70" r="20" fill="#2dd4bf" fill-opacity="0.18"/><circle cx="700" cy="70" r="10" fill="#2dd4bf"/>
      <circle cx="680" cy="200" r="26" fill="#ef4444" fill-opacity="0.2"/><circle cx="680" cy="200" r="14" fill="#ef4444"/>
      <circle cx="760" cy="282" r="18" fill="#f59e0b" fill-opacity="0.2"/><circle cx="760" cy="282" r="9" fill="#f59e0b"/>
      <circle cx="1135" cy="75" r="24" fill="#60a5fa" fill-opacity="0.2"/><circle cx="1135" cy="75" r="12" fill="#60a5fa"/>
      <circle cx="1150" cy="215" r="20" fill="#ef4444" fill-opacity="0.2"/><circle cx="1150" cy="215" r="10" fill="#ef4444"/>
      <circle cx="1060" cy="292" r="16" fill="#2dd4bf" fill-opacity="0.2"/><circle cx="1060" cy="292" r="8" fill="#2dd4bf"/>
      <circle cx="900" cy="34" r="16" fill="#ffffff" fill-opacity="0.12"/><circle cx="900" cy="34" r="8" fill="#ffffff" fill-opacity="0.7"/>
    </g>

    <!-- verdict card -->
    <g filter="url(#shadow)">
      <rect x="770" y="92" width="320" height="146" rx="16" fill="#ffffff"/>
    </g>
    <rect x="792" y="110" width="98" height="24" rx="12" fill="#fee2e2"/>
    <circle cx="806" cy="122" r="3.5" fill="#dc2626"/>
    <text x="815" y="127" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">HIGH RISK</text>
    <text x="1068" y="127" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b">Score 87/100</text>
    <text x="792" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">Your account is locked. Verify now:</text>
    <text x="792" y="184" font-family="'Courier New', Courier, monospace" font-size="14.5" font-weight="700" fill="#dc2626">https://paypa1-login.top</text>
    <rect x="792" y="199" width="118" height="22" rx="11" fill="#fef3c7"/>
    <text x="804" y="214" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#92400e">Look-alike domain</text>
    <rect x="918" y="199" width="68" height="22" rx="11" fill="#fef3c7"/>
    <text x="930" y="214" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#92400e">Urgency</text>
    <rect x="994" y="199" width="74" height="22" rx="11" fill="#d1fae5"/>
    <text x="1005" y="214" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#065f46">Evidence</text>

    <!-- left: brand -->
    <rect x="80" y="64" width="76" height="76" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/>
    <g transform="translate(118,102)" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -24 L20 -16 V5 C20 19 10 27 0 32 C-10 27 -20 19 -20 5 V-16 Z"/>
      <path d="M-8 3 L-2 9 L10 -5"/>
    </g>
    <text x="176" y="118" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">ProofLink</text>
    <text x="82" y="186" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#e2ecf5">Check before you trust.</text>
    <text x="82" y="218" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#9fb8cb">Paste a suspicious message, link, or screenshot.</text>
    <text x="82" y="241" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#9fb8cb">Get a verdict, the evidence, and the safest next step.</text>

    <g font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" fill="#d3e3ef">
      <rect x="82" y="264" width="98" height="28" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="98" y="283">Rule engine</text>
      <rect x="190" y="264" width="86" height="28" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="206" y="283">AI review</text>
      <rect x="286" y="264" width="82" height="28" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="302" y="283">3D graph</text>
    </g>
  </g>
</svg>
