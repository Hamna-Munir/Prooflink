services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prooflink
      POSTGRES_PASSWORD: prooflink
      POSTGRES_DB: prooflink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prooflink"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
